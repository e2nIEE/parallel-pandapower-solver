# This workflow will create a Python package and upload it to testPyPi or PyPi
# Then, it installs pandapower from there and all dependencies and runs tests with different Python versions

name: upload

# Controls when the action will run.
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      upload_server:
        description: 'upload server'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - 'testpypi'
          - 'pypi'

permissions:
  contents: read
  id-token: none

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  upload:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Job-level permissions replace the top-level ones, so contents: read must be repeated here
    permissions:
      contents: read
      id-token: write

    # One GitHub environment per index ("testpypi" / "pypi"). Each must match the environment
    # configured in the trusted publisher on test.pypi.org / pypi.org respectively.
    environment:
      name: ${{ inputs.upload_server }}
      url: ${{ inputs.upload_server == 'pypi' && 'https://pypi.org/p/parallel-pandapower-solver/' || 'https://test.pypi.org/p/parallel-pandapower-solver/' }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7


      # Sets up python3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'


      # Installs and upgrades pip, installs other dependencies and installs the package
      - name: Install dependencies
        run: |
          # Upgrade pip
          python3 -m pip install --upgrade pip
          # Install build tools
          sudo apt-get update
          sudo apt-get install -y libsuitesparse-dev
          python3 -m pip install build setuptools wheel
          python3 -m build


      # Upload to TestPyPI
      - name: Build and Upload to TestPyPI
        if: ${{ inputs.upload_server == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e #release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          skip-existing: true


      # Upload to PyPI
      - name: Build and Upload to PyPI
        if: ${{ inputs.upload_server == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e #release/v1


      # Run an installation for testing from PyPI
      - name: Install parallel-pandapower-solver from PyPI
        if: ${{ inputs.upload_server == 'pypi' }}
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          # A fresh release can take a moment to become installable, so retry a few times
          for i in 1 2 3 4 5; do
            python3 -m pip install --pre "parallel-pandapower-solver==$VERSION" && break
            [ "$i" -eq 5 ] && exit 1
            sleep 30
          done
          # Run outside the checkout so the installed package is imported, not the local source
          cd "$RUNNER_TEMP"
          python3 -c "import p3s; from importlib.metadata import version; print(version('parallel-pandapower-solver'))"
