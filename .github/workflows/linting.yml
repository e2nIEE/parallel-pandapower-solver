name: linting

on:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed so `--base` can diff against it
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reuse ruff mypy
      - run: reuse lint
      - run: ruff check
      - run: mypy
